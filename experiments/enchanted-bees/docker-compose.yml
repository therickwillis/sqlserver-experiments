services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ${CONTAINER_NAME}
    # Helps SQLPAL initialize correctly
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    privileged: true
    user: root
    restart: always
    ports:
      - "${EXTERNAL_PORT}:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${PASSWORD}
      - MSSQL_PID=Developer
    volumes:
      - mssql_data:/var/opt/mssql
  dev:
    build:
      context: .
      dockerfile: dev.Dockerfile
      args:
        - USER_ID=${USER_ID:-1000}
        - GROUP_ID=${GROUP_ID:-1000}
    container_name: ${DEV_CONTAINER_NAME:-enchanted-bees-dev}
    restart: no
    tty: true
    volumes:
      - ./:/workspace
    working_dir: /workspace/experiments/enchanted-bees
    environment:
      - DB_SERVER=sqlserver
      - DB_PORT=1433
      - DB_NAME=EnchantedBeesDB
      - DB_USER=sa
      - DB_PASSWORD=${PASSWORD}
      - EXTERNAL_PORT=${EXTERNAL_PORT}
      - DEV_MODE=${DEV_MODE:-0}
    depends_on:
      - sqlserver

volumes:
  mssql_data: